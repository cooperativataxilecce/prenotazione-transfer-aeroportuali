
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Prenotazione transfer | CTL</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px 16px;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            background: #f7f8fa;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        .lang-switch {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 18px;
        }

        .lang-switch select {
            width: auto;
            max-width: 100%;
            padding: 9px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #333;
            font-size: 14px;
            cursor: pointer;
        }

        .card {
            padding: 28px;
            border: 1px solid #ececec;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .05);
        }

        .logo {
            display: block;
            width: 150px;
            max-width: 60%;
            height: auto;
            margin: 0 auto 22px;
            object-fit: contain;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
            line-height: 1.3;
            text-align: center;
        }

        .intro {
            margin: 0 0 25px;
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
        }

        .section-title {
            margin: 25px 0 8px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            font-size: 17px;
        }

        .field-group { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
        }

        input, select, textarea, button {
            width: 100%;
            font: inherit;
        }

        input, select, textarea {
            min-height: 46px;
            padding: 11px 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            background: #fff;
            color: #222;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid #f0a04b;
            outline-offset: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 14px;
        }

        .check-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 18px 0;
            font-size: 13px;
            line-height: 1.5;
        }

        .check-row input {
            width: 18px;
            min-height: 18px;
            margin: 1px 0 0;
            flex: 0 0 18px;
        }

        .check-row label {
            margin: 0;
            font-weight: 400;
        }

        .payment-note {
            padding: 14px;
            border-radius: 9px;
            background: #f7f8fa;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        .submit-button {
            margin-top: 10px;
            padding: 15px 18px;
            border: 0;
            border-radius: 9px;
            background: #ef963c;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-button:hover { background: #dc8128; }

        .error {
            display: none;
            margin-top: 14px;
            color: #b42318;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #555;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
        }

        .back-link:hover { text-decoration: underline; }

        @media (max-width: 520px) {
            body { padding: 16px 12px; }
            .card { padding: 22px 18px; }
            h1 { font-size: 23px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="lang-switch">
            <select id="languageSelect" aria-label="Seleziona lingua">
                <option value="it">🇮🇹 Italiano</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="es">🇪🇸 Español</option>
                <option value="de">🇩🇪 Deutsch</option>
            </select>
        </div>

        <section class="card">
            <img class="logo" src="logo3.png" alt="CTL">

            <h1 id="pageTitle">Prenota il tuo transfer</h1>
            <p class="intro" id="intro">
                Inserisci i tuoi dati e i dettagli del viaggio. Ti ricontatteremo per confermare la prenotazione.
            </p>

            <form id="bookingForm">
                <h2 class="section-title" id="journeyTitle">Dettagli del transfer</h2>

                <div class="grid">
                    <div class="field-group">
                        <label for="transferType" id="typeLabel">Tipo di transfer</label>
                        <select id="transferType" name="tipo" required>
                            <option value="aeroportuale" id="airportTransferOption">Transfer aeroportuale</option>
                            <option value="privati" id="privateTransferOption">Transfer privato</option>
                        </select>
                    </div>

                    <div class="field-group" id="airportGroup">
                        <label for="airport" id="airportLabel">Aeroporto</label>
                        <select id="airport" name="aeroporto">
                            <option value="Brindisi">Brindisi (BDS)</option>
                            <option value="Bari">Bari (BRI)</option>
                        </select>
                    </div>
                </div>

                <div class="field-group" id="flightGroup">
                    <label for="flight" id="flightLabel">Numero del volo</label>
                    <input id="flight" name="volo" type="text" placeholder="Es. FR1234">
                </div>

                <div class="field-group">
                    <label for="pickup" id="pickupLabel">Indirizzo di partenza</label>
                    <input id="pickup" name="partenza" type="text" required autocomplete="street-address">
                </div>

                <div class="field-group">
                    <label for="destination" id="destinationLabel">Indirizzo di destinazione</label>
                    <input id="destination" name="destinazione" type="text" required>
                </div>

                <div class="grid">
                    <div class="field-group">
                        <label for="date" id="dateLabel">Data del transfer</label>
                        <input id="date" name="data" type="date" required>
                    </div>

                    <div class="field-group">
                        <label for="time" id="timeLabel">Orario</label>
                        <input id="time" name="orario" type="time" required>
                    </div>
                </div>

                <div class="grid">
                    <div class="field-group">
                        <label for="passengers" id="passengersLabel">Numero di passeggeri</label>
                        <select id="passengers" name="passeggeri" required>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <label for="luggage" id="luggageLabel">Bagagli</label>
                        <select id="luggage" name="bagagli">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5+</option>
                        </select>
                    </div>
                </div>

                <h2 class="section-title" id="contactTitle">Dati di contatto</h2>

                <div class="field-group">
                    <label for="name" id="nameLabel">Nome e cognome</label>
                    <input id="name" name="nome" type="text" required autocomplete="name">
                </div>

                <div class="grid">
                    <div class="field-group">
                        <label for="phone" id="phoneLabel">Numero di telefono</label>
                        <input id="phone" name="telefono" type="tel" required autocomplete="tel">
                    </div>

                    <div class="field-group">
                        <label for="email" id="emailLabel">Email (facoltativa)</label>
                        <input id="email" name="email" type="email" autocomplete="email">
                    </div>
                </div>

                <div class="field-group">
                    <label for="notes" id="notesLabel">Note aggiuntive (facoltative)</label>
                    <textarea id="notes" name="note"></textarea>
                </div>

                <h2 class="section-title" id="paymentTitle">Pagamento</h2>

                <div class="payment-note" id="paymentNote">
                    Le modalità di pagamento saranno concordate con CTL al momento della conferma della prenotazione.
                </div>

                <div class="check-row">
                    <input id="privacy" name="privacy" type="checkbox" required>
                    <label for="privacy" id="privacyLabel">
                        Confermo di aver letto l'informativa sulla privacy e acconsento al trattamento dei miei dati per gestire la richiesta.
                    </label>
                </div>

                <button class="submit-button" id="submitButton" type="submit">
                    Continua su WhatsApp
                </button>

                <p class="error" id="errorMessage" role="alert"></p>
            </form>

            <a class="back-link" id="backLink" href="index.html">Torna indietro</a>
        </section>
    </main>

    <script>
        const translations = {
            it: {
                title: "Prenota il tuo transfer",
                intro: "Inserisci i tuoi dati e i dettagli del viaggio. Ti ricontatteremo per confermare la prenotazione.",
                journeyTitle: "Dettagli del transfer",
                typeLabel: "Tipo di transfer",
                airportTransfer: "Transfer aeroportuale",
                privateTransfer: "Transfer privato",
                airportLabel: "Aeroporto",
                flightLabel: "Numero del volo",
                pickupLabel: "Indirizzo di partenza",
                destinationLabel: "Indirizzo di destinazione",
                dateLabel: "Data del transfer",
                timeLabel: "Orario",
                passengersLabel: "Numero di passeggeri",
                luggageLabel: "Bagagli",
                contactTitle: "Dati di contatto",
                nameLabel: "Nome e cognome",
                phoneLabel: "Numero di telefono",
                emailLabel: "Email (facoltativa)",
                notesLabel: "Note aggiuntive (facoltative)",
                paymentTitle: "Pagamento",
                paymentNote: "Le modalità di pagamento saranno concordate con CTL al momento della conferma della prenotazione.",
                privacyLabel: "Confermo di aver letto l'informativa sulla privacy e acconsento al trattamento dei miei dati per gestire la richiesta.",
                submit: "Continua su WhatsApp",
                back: "Torna indietro",
                error: "Controlla di aver compilato tutti i campi obbligatori e accettato l'informativa sulla privacy.",
                finalMessage: "Grazie per aver contattato CTL. La tua richiesta sarà verificata."
            },
            en: {
                title: "Book your transfer",
                intro: "Enter your details and journey information. We will contact you to confirm your booking.",
                journeyTitle: "Transfer details",
                typeLabel: "Transfer type",
                airportTransfer: "Airport transfer",
                privateTransfer: "Private transfer",
                airportLabel: "Airport",
                flightLabel: "Flight number",
                pickupLabel: "Pickup address",
                destinationLabel: "Destination address",
                dateLabel: "Transfer date",
                timeLabel: "Time",
                passengersLabel: "Number of passengers",
                luggageLabel: "Luggage",
                contactTitle: "Contact details",
                nameLabel: "Full name",
                phoneLabel: "Phone number",
                emailLabel: "Email (optional)",
                notesLabel: "Additional notes (optional)",
                paymentTitle: "Payment",
                paymentNote: "Payment arrangements will be agreed with CTL when your booking is confirmed.",
                privacyLabel: "I confirm that I have read the privacy notice and consent to the processing of my data to handle this request.",
                submit: "Continue on WhatsApp",
                back: "Go back",
                error: "Please complete all required fields and accept the privacy notice.",
                finalMessage: "Thank you for contacting CTL. Your request will be reviewed."
            },
            fr: {
                title: "Réservez votre transfert",
                intro: "Saisissez vos coordonnées et les détails du trajet. Nous vous contacterons pour confirmer votre réservation.",
                journeyTitle: "Détails du transfert",
                typeLabel: "Type de transfert",
                airportTransfer: "Transfert aéroport",
                privateTransfer: "Transfert privé",
                airportLabel: "Aéroport",
                flightLabel: "Numéro de vol",
                pickupLabel: "Adresse de départ",
                destinationLabel: "Adresse de destination",
                dateLabel: "Date du transfert",
                timeLabel: "Heure",
                passengersLabel: "Nombre de passagers",
                luggageLabel: "Bagages",
                contactTitle: "Coordonnées",
                nameLabel: "Nom et prénom",
                phoneLabel: "Numéro de téléphone",
                emailLabel: "E-mail (facultatif)",
                notesLabel: "Notes supplémentaires (facultatif)",
                paymentTitle: "Paiement",
                paymentNote: "Les modalités de paiement seront convenues avec CTL lors de la confirmation de la réservation.",
                privacyLabel: "Je confirme avoir lu la politique de confidentialité et j'accepte le traitement de mes données pour gérer cette demande.",
                submit: "Continuer sur WhatsApp",
                back: "Retour",
                error: "Veuillez remplir tous les champs obligatoires et accepter la politique de confidentialité.",
                finalMessage: "Merci d'avoir contacté CTL. Votre demande sera examinée."
            },
            es: {
                title: "Reserva tu traslado",
                intro: "Introduce tus datos y los detalles del viaje. Nos pondremos en contacto contigo para confirmar la reserva.",
                journeyTitle: "Detalles del traslado",
                typeLabel: "Tipo de traslado",
                airportTransfer: "Traslado al aeropuerto",
                privateTransfer: "Traslado privado",
                airportLabel: "Aeropuerto",
                flightLabel: "Número de vuelo",
                pickupLabel: "Dirección de recogida",
                destinationLabel: "Dirección de destino",
                dateLabel: "Fecha del traslado",
                timeLabel: "Hora",
                passengersLabel: "Número de pasajeros",
                luggageLabel: "Equipaje",
                contactTitle: "Datos de contacto",
                nameLabel: "Nombre y apellidos",
                phoneLabel: "Número de teléfono",
                emailLabel: "Correo electrónico (opcional)",
                notesLabel: "Notas adicionales (opcional)",
                paymentTitle: "Pago",
                paymentNote: "Las condiciones de pago se acordarán con CTL al confirmar la reserva.",
                privacyLabel: "Confirmo que he leído la política de privacidad y doy mi consentimiento para tratar mis datos para gestionar esta solicitud.",
                submit: "Continuar en WhatsApp",
                back: "Volver",
                error: "Completa todos los campos obligatorios y acepta la política de privacidad.",
                finalMessage: "Gracias por contactar con CTL. Revisaremos tu solicitud."
            },
            de: {
                title: "Transfer buchen",
                intro: "Geben Sie Ihre Kontaktdaten und Reisedetails ein. Wir kontaktieren Sie zur Bestätigung Ihrer Buchung.",
                journeyTitle: "Transferdetails",
                typeLabel: "Transferart",
                airportTransfer: "Flughafentransfer",
                privateTransfer: "Privater Transfer",
                airportLabel: "Flughafen",
                flightLabel: "Flugnummer",
                pickupLabel: "Abholadresse",
                destinationLabel: "Zieladresse",
                dateLabel: "Transferdatum",
                timeLabel: "Uhrzeit",
                passengersLabel: "Anzahl der Fahrgäste",
                luggageLabel: "Gepäck",
                contactTitle: "Kontaktdaten",
                nameLabel: "Vor- und Nachname",
                phoneLabel: "Telefonnummer",
                emailLabel: "E-Mail (optional)",
                notesLabel: "Zusätzliche Hinweise (optional)",
                paymentTitle: "Zahlung",
                paymentNote: "Die Zahlungsmodalitäten werden bei der Buchungsbestätigung mit CTL vereinbart.",
                privacyLabel: "Ich bestätige, dass ich die Datenschutzhinweise gelesen habe und der Verarbeitung meiner Daten zur Bearbeitung dieser Anfrage zustimme.",
                submit: "Weiter zu WhatsApp",
                back: "Zurück",
                error: "Bitte füllen Sie alle Pflichtfelder aus und akzeptieren Sie die Datenschutzhinweise.",
                finalMessage: "Vielen Dank, dass Sie CTL kontaktiert haben. Ihre Anfrage wird geprüft."
            }
        };

        const validLanguages = ["it", "en", "fr", "es", "de"];
        const languageSelect = document.getElementById("languageSelect");
        const params = new URLSearchParams(window.location.search);

        function getInitialLanguage() {
            const saved = localStorage.getItem("ctl_lang");

            if (validLanguages.includes(saved)) return saved;

            const fromUrl = params.get("lang");

            if (validLanguages.includes(fromUrl)) return fromUrl;

            return "it";
        }

        function setLanguage(lang) {
            if (!validLanguages.includes(lang)) lang = "it";

            localStorage.setItem("ctl_lang", lang);
            document.documentElement.lang = lang;
            languageSelect.value = lang;

            const t = translations[lang];

            document.title = t.title + " | CTL";

            const ids = {
                pageTitle: "title",
                intro: "intro",
                journeyTitle: "journeyTitle",
                typeLabel: "typeLabel",
                airportTransferOption: "airportTransfer",
                privateTransferOption: "privateTransfer",
                airportLabel: "airportLabel",
                flightLabel: "flightLabel",
                pickupLabel: "pickupLabel",
                destinationLabel: "destinationLabel",
                dateLabel: "dateLabel",
                timeLabel: "timeLabel",
                passengersLabel: "passengersLabel",
                luggageLabel: "luggageLabel",
                contactTitle: "contactTitle",
                nameLabel: "nameLabel",
                phoneLabel: "phoneLabel",
                emailLabel: "emailLabel",
                notesLabel: "notesLabel",
                paymentTitle: "paymentTitle",
                paymentNote: "paymentNote",
                privacyLabel: "privacyLabel",
                submitButton: "submit",
                backLink: "back"
            };

            Object.entries(ids).forEach(([elementId, translationKey]) => {
                document.getElementById(elementId).textContent = t[translationKey];
            });

            document.getElementById("errorMessage").textContent = "";
            document.getElementById("errorMessage").style.display = "none";

            updateTransferFields();
        }

        function updateTransferFields() {
            const isAirport = document.getElementById("transferType").value === "aeroportuale";

            document.getElementById("airportGroup").style.display = isAirport ? "block" : "none";
            document.getElementById("flightGroup").style.display = isAirport ? "block" : "none";

            document.getElementById("airport").required = isAirport;
            document.getElementById("flight").required = false;

            if (!isAirport) {
                document.getElementById("airport").value = "";
                document.getElementById("flight").value = "";
            }
        }

        languageSelect.addEventListener("change", function () {
            setLanguage(this.value);
        });

        document.getElementById("transferType").addEventListener("change", updateTransferFields);

        function fillFromUrl() {
            const tipo = params.get("tipo");
            const aeroporto = params.get("aeroporto");

            if (tipo === "aeroportuale" || tipo === "privati") {
                document.getElementById("transferType").value = tipo;
            }

            if (aeroporto === "Brindisi" || aeroporto === "Bari") {
                document.getElementById("airport").value = aeroporto;
            }

            updateTransferFields();
        }

        document.getElementById("bookingForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const form = event.currentTarget;

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const lang = validLanguages.includes(localStorage.getItem("ctl_lang"))
                ? localStorage.getItem("ctl_lang")
                : "it";

            const t = translations[lang];
            const tipoValue = document.getElementById("transferType").value;
            const tipoText = tipoValue === "aeroportuale"
                ? "Transfer aeroportuale"
                : "Transfer privato";

            const nome = document.getElementById("name").value.trim();
            const telefono = document.getElementById("phone").value.trim();
            const email = document.getElementById("email").value.trim();
            const aeroporto = document.getElementById("airport").value;
            const volo = document.getElementById("flight").value.trim();
            const partenza = document.getElementById("pickup").value.trim();
            const destinazione = document.getElementById("destination").value.trim();
            const data = document.getElementById("date").value;
            const orario = document.getElementById("time").value;
            const passeggeri = document.getElementById("passengers").value;
            const bagagli = document.getElementById("luggage").value;
            const note = document.getElementById("notes").value.trim();

            const lines = [
                "Buongiorno, vorrei richiedere una prenotazione transfer.",
                "",
                "Tipo di transfer: " + tipoText
            ];

            if (tipoValue === "aeroportuale") {
                lines.push("Aeroporto: " + aeroporto);

                if (volo) lines.push("Numero del volo: " + volo);
            }

            lines.push(
                "Nome e cognome: " + nome,
                "Telefono: " + telefono,
                "Email: " + (email || "Non indicata"),
                "Partenza: " + partenza,
                "Destinazione: " + destinazione,
                "Data: " + data,
                "Orario: " + orario,
                "Passeggeri: " + passeggeri,
                "Bagagli: " + bagagli,
                "Note: " + (note || "Nessuna"),
                "",
                t.finalMessage
            );

            const message = lines.join("\n");
            const whatsappUrl = "https://wa.me/393286714428?text=" + encodeURIComponent(message);

            window.location.href = whatsappUrl;
        });

        document.getElementById("date").min = new Date().toLocaleDateString("en-CA");

        fillFromUrl();
        setLanguage(getInitialLanguage());
    </script>
</body>
</html>
