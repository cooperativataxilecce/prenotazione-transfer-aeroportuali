
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Aeroportuale | Cooperativa Taxi Lecce</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}
body {
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 25px;
}
.container {
    position: relative;
    background: white;
    max-width: 650px;
    width: 100%;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
}
.logo {
    display: block;
    margin: 10px auto 25px;
    width: 400px;
    max-width: 100%;
}
.lang-switch {
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
}
.lang-switch button {
    width: auto;
    margin: 0;
    padding: 8px 10px;
    background: #fff;
    color: #444;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-weight: normal;
    cursor: pointer;
}
.lang-switch button.active {
    background: #f39c12;
    color: white;
    border-color: #f39c12;
}
h2 {
    text-align: center;
    color: #111;
    margin-bottom: 10px;
    line-height: 1.4;
}
.info {
    text-align: center;
    font-size: 14px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 30px;
}
label {
    display: block;
    font-weight: bold;
    margin-top: 20px;
    margin-bottom: 8px;
}
select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 15px;
    background: white;
}
.continue-btn {
    width: 100%;
    margin-top: 35px;
    padding: 16px;
    background: #f39c12;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
.continue-btn:hover {
    background: #d87f00;
}
@media (max-width: 480px) {
    .container { padding: 22px; }
    body { padding: 15px; }
}
</style>
</head>

<body>
<div class="container">

    <div class="lang-switch" data-i18n-aria="languageSelector">
        <button type="button" data-lang="it" aria-pressed="false">🇮🇹 IT</button>
        <button type="button" data-lang="en" aria-pressed="false">🇬🇧 EN</button>
        <button type="button" data-lang="fr" aria-pressed="false">🇫🇷 FR</button>
        <button type="button" data-lang="es" aria-pressed="false">🇪🇸 ES</button>
        <button type="button" data-lang="de" aria-pressed="false">🇩🇪 DE</button>
    </div>

    <img src="logo3.png" class="logo" alt="Cooperativa Taxi Lecce">

    <h2 data-i18n="heading">Transfer Aeroportuale</h2>

    <p class="info" data-i18n="intro">
        Scegli il tipo di transfer e l'aeroporto. Ti guideremo nella richiesta del servizio.
    </p>

    <label for="tipo" data-i18n="transferType">Tipo di transfer</label>
    <select id="tipo" required>
        <option value="" data-i18n="selectOption">Seleziona...</option>
        <option value="verso" data-i18n="toAirport">Devo raggiungere l'aeroporto</option>
        <option value="da" data-i18n="fromAirport">Devo essere prelevato dall'aeroporto</option>
    </select>

    <label for="aeroporto" data-i18n="airport">Aeroporto</label>
    <select id="aeroporto" required>
        <option value="" data-i18n="selectAirport">Seleziona aeroporto...</option>
        <option value="Aeroporto del Salento - Brindisi (BDS)" data-i18n="brindisi">
            Aeroporto di Brindisi
        </option>
        <option value="Aeroporto Internazionale di Bari (BRI)" data-i18n="bari">
            Aeroporto di Bari
        </option>
    </select>

    <button type="button" class="continue-btn" onclick="continua()" data-i18n="continue">
        Continua
    </button>

</div>

<script>
const translations = {
    it: {
        title: "Transfer Aeroportuale | Cooperativa Taxi Lecce",
        languageSelector: "Seleziona lingua",
        heading: "Transfer Aeroportuale",
        intro: "Scegli il tipo di transfer e l'aeroporto. Ti guideremo nella richiesta del servizio.",
        transferType: "Tipo di transfer",
        selectOption: "Seleziona...",
        toAirport: "Devo raggiungere l'aeroporto",
        fromAirport: "Devo essere prelevato dall'aeroporto",
        airport: "Aeroporto",
        selectAirport: "Seleziona aeroporto...",
        brindisi: "Aeroporto di Brindisi",
        bari: "Aeroporto di Bari",
        continue: "Continua",
        error: "Seleziona il tipo di transfer e l'aeroporto."
    },
    en: {
        title: "Airport Transfer | Cooperativa Taxi Lecce",
        languageSelector: "Select language",
        heading: "Airport Transfer",
        intro: "Choose your transfer type and airport. We will guide you through the booking request.",
        transferType: "Transfer type",
        selectOption: "Select...",
        toAirport: "I need to get to the airport",
        fromAirport: "I need to be picked up from the airport",
        airport: "Airport",
        selectAirport: "Select airport...",
        brindisi: "Brindisi Airport",
        bari: "Bari Airport",
        continue: "Continue",
        error: "Please select the transfer type and airport."
    },
    fr: {
        title: "Transfert aéroport | Cooperativa Taxi Lecce",
        languageSelector: "Choisir la langue",
        heading: "Transfert aéroport",
        intro: "Choisissez le type de transfert et l'aéroport. Nous vous guiderons dans votre demande de réservation.",
        transferType: "Type de transfert",
        selectOption: "Sélectionner...",
        toAirport: "Je dois me rendre à l'aéroport",
        fromAirport: "Je dois être pris en charge à l'aéroport",
        airport: "Aéroport",
        selectAirport: "Sélectionner un aéroport...",
        brindisi: "Aéroport de Brindisi",
        bari: "Aéroport de Bari",
        continue: "Continuer",
        error: "Veuillez sélectionner le type de transfert et l'aéroport."
    },
    es: {
        title: "Traslado al aeropuerto | Cooperativa Taxi Lecce",
        languageSelector: "Seleccionar idioma",
        heading: "Traslado al aeropuerto",
        intro: "Elige el tipo de traslado y el aeropuerto. Te guiaremos para solicitar el servicio.",
        transferType: "Tipo de traslado",
        selectOption: "Seleccionar...",
        toAirport: "Necesito ir al aeropuerto",
        fromAirport: "Necesito que me recojan en el aeropuerto",
        airport: "Aeropuerto",
        selectAirport: "Seleccionar aeropuerto...",
        brindisi: "Aeropuerto de Brindisi",
        bari: "Aeropuerto de Bari",
        continue: "Continuar",
        error: "Selecciona el tipo de traslado y el aeropuerto."
    },
    de: {
        title: "Flughafentransfer | Cooperativa Taxi Lecce",
        languageSelector: "Sprache auswählen",
        heading: "Flughafentransfer",
        intro: "Wählen Sie die Transferart und den Flughafen. Wir führen Sie durch die Buchungsanfrage.",
        transferType: "Transferart",
        selectOption: "Auswählen...",
        toAirport: "Ich muss zum Flughafen fahren",
        fromAirport: "Ich muss am Flughafen abgeholt werden",
        airport: "Flughafen",
        selectAirport: "Flughafen auswählen...",
        brindisi: "Flughafen Brindisi",
        bari: "Flughafen Bari",
        continue: "Weiter",
        error: "Bitte wählen Sie die Transferart und den Flughafen aus."
    }
};

const validLanguages = ["it", "en", "fr", "es", "de"];

function getLanguage() {
    const saved = localStorage.getItem("ctl_lang");
    if (validLanguages.includes(saved)) return saved;

    const requested = new URLSearchParams(location.search).get("lang");
    if (validLanguages.includes(requested)) return requested;

    return "it";
}

function setLanguage(lang) {
    if (!validLanguages.includes(lang)) return;

    localStorage.setItem("ctl_lang", lang);
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;
        if (translations[lang][key] !== undefined) {
            element.textContent = translations[lang][key];
        }
    });

    document.querySelectorAll("[data-i18n-aria]").forEach(element => {
        const key = element.dataset.i18nAria;
        element.setAttribute("aria-label", translations[lang][key]);
    });

    document.querySelectorAll(".lang-switch button").forEach(button => {
        const active = button.dataset.lang === lang;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
    });

    document.title = translations[lang].title;
}

document.querySelectorAll(".lang-switch button").forEach(button => {
    button.addEventListener("click", () => setLanguage(button.dataset.lang));
});

function continua() {
    const tipo = document.getElementById("tipo").value;
    const aeroporto = document.getElementById("aeroporto").value;
    const lang = getLanguage();

    if (!tipo || !aeroporto) {
        alert(translations[lang].error);
        return;
    }

    const params = new URLSearchParams({ tipo, aeroporto, lang });
    window.location.href = "prenotazione.html?" + params.toString();
}

window.addEventListener("pageshow", () => setLanguage(getLanguage()));

window.addEventListener("storage", event => {
    if (event.key === "ctl_lang") setLanguage(getLanguage());
});

setLanguage(getLanguage());
</script>
</body>
</html>
