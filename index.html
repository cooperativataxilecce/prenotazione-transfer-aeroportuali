
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Transfer aeroportuali | CTL</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px 16px;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            background: #f7f8fa;
        }

        .container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
        }

        .lang-switch {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 18px;
        }

        .lang-switch select {
            width: auto;
            max-width: 100%;
            padding: 9px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #333;
            font-size: 14px;
            cursor: pointer;
        }

        .card {
            padding: 28px;
            border: 1px solid #ececec;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .05);
        }

        .logo {
            display: block;
            width: 150px;
            max-width: 60%;
            height: auto;
            margin: 0 auto 22px;
            object-fit: contain;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 26px;
            line-height: 1.25;
            text-align: center;
        }

        .intro {
            margin: 0 0 26px;
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
            font-weight: 700;
        }

        select, input, button {
            width: 100%;
            min-height: 48px;
            font: inherit;
        }

        .field {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            background: #fff;
            color: #222;
        }

        .field:focus, .lang-switch select:focus {
            outline: 2px solid #f0a04b;
            outline-offset: 2px;
        }

        .continue {
            margin-top: 24px;
            padding: 14px 18px;
            border: 0;
            border-radius: 9px;
            background: #ef963c;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .continue:hover { background: #dc8128; }

        .error {
            display: none;
            margin-top: 14px;
            color: #b42318;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            body { padding: 16px 12px; }
            .card { padding: 22px 18px; }
            h1 { font-size: 23px; }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="lang-switch">
            <select id="languageSelect" aria-label="Seleziona lingua">
                <option value="it">🇮🇹 Italiano</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="es">🇪🇸 Español</option>
                <option value="de">🇩🇪 Deutsch</option>
            </select>
        </div>

        <section class="card">
            <img class="logo" src="logo3.png" alt="CTL">

            <h1 id="pageTitle">Transfer aeroportuali</h1>
            <p class="intro" id="intro">
                Organizza il tuo trasferimento con CTL. Scegli il servizio e l'aeroporto.
            </p>

            <form id="transferForm">
                <label for="transferType" id="typeLabel">Tipo di transfer</label>
                <select class="field" id="transferType" required>
                    <option value="" id="typePlaceholder">Seleziona un servizio</option>
                    <option value="aeroportuale" id="airportTransferOption">Transfer aeroportuale</option>
                    <option value="privati" id="privateTransferOption">Transfer privato</option>
                </select>

                <div id="airportGroup">
                    <label for="airport" id="airportLabel">Aeroporto</label>
                    <select class="field" id="airport">
                        <option value="" id="airportPlaceholder">Seleziona l'aeroporto</option>
                        <option value="Brindisi">Brindisi (BDS)</option>
                        <option value="Bari">Bari (BRI)</option>
                    </select>
                </div>

                <button class="continue" type="submit" id="continueButton">
                    Continua
                </button>

                <p class="error" id="errorMessage" role="alert"></p>
            </form>
        </section>
    </main>

    <script>
        const translations = {
            it: {
                title: "Transfer aeroportuali",
                intro: "Organizza il tuo trasferimento con CTL. Scegli il servizio e l'aeroporto.",
                typeLabel: "Tipo di transfer",
                typePlaceholder: "Seleziona un servizio",
                airportTransfer: "Transfer aeroportuale",
                privateTransfer: "Transfer privato",
                airportLabel: "Aeroporto",
                airportPlaceholder: "Seleziona l'aeroporto",
                continue: "Continua",
                errorType: "Seleziona il tipo di transfer.",
                errorAirport: "Seleziona l'aeroporto."
            },
            en: {
                title: "Airport transfers",
                intro: "Organize your transfer with CTL. Choose the service and airport.",
                typeLabel: "Transfer type",
                typePlaceholder: "Select a service",
                airportTransfer: "Airport transfer",
                privateTransfer: "Private transfer",
                airportLabel: "Airport",
                airportPlaceholder: "Select the airport",
                continue: "Continue",
                errorType: "Please select a transfer type.",
                errorAirport: "Please select an airport."
            },
            fr: {
                title: "Transferts aéroport",
                intro: "Organisez votre transfert avec CTL. Choisissez le service et l'aéroport.",
                typeLabel: "Type de transfert",
                typePlaceholder: "Sélectionnez un service",
                airportTransfer: "Transfert aéroport",
                privateTransfer: "Transfert privé",
                airportLabel: "Aéroport",
                airportPlaceholder: "Sélectionnez l'aéroport",
                continue: "Continuer",
                errorType: "Veuillez sélectionner le type de transfert.",
                errorAirport: "Veuillez sélectionner un aéroport."
            },
            es: {
                title: "Traslados al aeropuerto",
                intro: "Organiza tu traslado con CTL. Elige el servicio y el aeropuerto.",
                typeLabel: "Tipo de traslado",
                typePlaceholder: "Selecciona un servicio",
                airportTransfer: "Traslado al aeropuerto",
                privateTransfer: "Traslado privado",
                airportLabel: "Aeropuerto",
                airportPlaceholder: "Selecciona el aeropuerto",
                continue: "Continuar",
                errorType: "Selecciona el tipo de traslado.",
                errorAirport: "Selecciona el aeropuerto."
            },
            de: {
                title: "Flughafentransfers",
                intro: "Organisieren Sie Ihren Transfer mit CTL. Wählen Sie den Service und den Flughafen.",
                typeLabel: "Transferart",
                typePlaceholder: "Service auswählen",
                airportTransfer: "Flughafentransfer",
                privateTransfer: "Privater Transfer",
                airportLabel: "Flughafen",
                airportPlaceholder: "Flughafen auswählen",
                continue: "Weiter",
                errorType: "Bitte wählen Sie eine Transferart aus.",
                errorAirport: "Bitte wählen Sie einen Flughafen aus."
            }
        };

        const validLanguages = ["it", "en", "fr", "es", "de"];
        const languageSelect = document.getElementById("languageSelect");
        const transferType = document.getElementById("transferType");
        const airportGroup = document.getElementById("airportGroup");
        const airportSelect = document.getElementById("airport");
        const errorMessage = document.getElementById("errorMessage");

        function getInitialLanguage() {
            const saved = localStorage.getItem("ctl_lang");

            if (validLanguages.includes(saved)) {
                return saved;
            }

            const urlLanguage = new URLSearchParams(window.location.search).get("lang");

            if (validLanguages.includes(urlLanguage)) {
                return urlLanguage;
            }

            return "it";
        }

        function setLanguage(lang) {
            if (!validLanguages.includes(lang)) lang = "it";

            localStorage.setItem("ctl_lang", lang);
            document.documentElement.lang = lang;
            languageSelect.value = lang;

            const t = translations[lang];

            document.title = t.title + " | CTL";
            document.getElementById("pageTitle").textContent = t.title;
            document.getElementById("intro").textContent = t.intro;
            document.getElementById("typeLabel").textContent = t.typeLabel;
            document.getElementById("typePlaceholder").textContent = t.typePlaceholder;
            document.getElementById("airportTransferOption").textContent = t.airportTransfer;
            document.getElementById("privateTransferOption").textContent = t.privateTransfer;
            document.getElementById("airportLabel").textContent = t.airportLabel;
            document.getElementById("airportPlaceholder").textContent = t.airportPlaceholder;
            document.getElementById("continueButton").textContent = t.continue;

            updateAirportVisibility();
            errorMessage.textContent = "";
            errorMessage.style.display = "none";
        }

        function updateAirportVisibility() {
            const isAirportTransfer = transferType.value === "aeroportuale";

            airportGroup.style.display = isAirportTransfer ? "block" : "none";
            airportSelect.required = isAirportTransfer;

            if (!isAirportTransfer) airportSelect.value = "";
        }

        languageSelect.addEventListener("change", function () {
            setLanguage(this.value);
        });

        transferType.addEventListener("change", updateAirportVisibility);

        document.getElementById("transferForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const lang = validLanguages.includes(localStorage.getItem("ctl_lang"))
                ? localStorage.getItem("ctl_lang")
                : "it";

            const t = translations[lang];

            if (!transferType.value) {
                errorMessage.textContent = t.errorType;
                errorMessage.style.display = "block";
                return;
            }

            if (transferType.value === "aeroportuale" && !airportSelect.value) {
                errorMessage.textContent = t.errorAirport;
                errorMessage.style.display = "block";
                return;
            }

            const params = new URLSearchParams();
            params.set("tipo", transferType.value);
            params.set("lang", lang);

            if (transferType.value === "aeroportuale") {
                params.set("aeroporto", airportSelect.value);
            }

            window.location.href = "prenotazione.html?" + params.toString();
        });

        setLanguage(getInitialLanguage());
        updateAirportVisibility();
    </script>
</body>
</html>
